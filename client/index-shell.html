<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtemisOps - Mission Control</title>
  <link rel="stylesheet" href="css/ao-frames.css">
  <link rel="stylesheet" href="css/ao-themes.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #1a1f3a;
      --bg-panel: #0d1128;
      --border-blue: #4a9eff;
      --text-primary: #e0e6ed;
      --text-secondary: #8ab4f8;
      --accent-blue: #4a9eff;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-panel) 100%);
      color: var(--text-primary);
    }
    
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    
    /* ===== HEADER ===== */
    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 20, 40, 0.9);
      border-bottom: 2px solid var(--border-blue);
      box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .header-logo {
      height: 50px;
      width: 50px;
      object-fit: contain;
    }
    
    .header-title {
      font-size: 1.8em;
      letter-spacing: 6px;
      color: var(--accent-blue);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(74, 158, 255, 0.8);
    }
    
    .header-subtitle {
      font-size: 0.75em;
      color: var(--text-secondary);
      letter-spacing: 2px;
      max-width: 300px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .mission-selector {
      background: rgba(74, 158, 255, 0.1);
      border: 2px solid rgba(74, 158, 255, 0.4);
      color: var(--text-primary);
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.9em;
      border-radius: 4px;
      cursor: pointer;
      min-width: 180px;
    }
    
    .mission-selector:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
    }
    
    .notification-btn {
      position: relative;
      background: none;
      border: 2px solid rgba(74, 158, 255, 0.3);
      color: var(--text-secondary);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      transition: all 0.3s;
    }
    
    .notification-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    
    .notification-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff4444;
      color: white;
      font-size: 0.6em;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .notification-badge:empty,
    .notification-badge.hidden {
      display: none;
    }
    
    /* ===== TAB NAVIGATION ===== */
    .tab-nav {
      flex-shrink: 0;
      display: flex;
      background: rgba(10, 20, 40, 0.8);
      border-bottom: 2px solid rgba(74, 158, 255, 0.3);
      padding: 0 20px;
    }
    
    .tab-btn {
      background: none;
      border: none;
      color: #6a7f99;
      padding: 15px 30px;
      font-family: inherit;
      font-size: 1em;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab-btn:hover {
      color: var(--text-secondary);
    }
    
    .tab-btn.active {
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
    }
    
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-blue);
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.8);
    }
    
    .tab-icon {
      font-size: 1.1em;
    }
    
    /* ===== TAB CONTENT ===== */
    .tab-content {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    
    .tab-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    
    .tab-frame.active {
      display: block;
    }
    
    /* ===== LOADING OVERLAY ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 39, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(74, 158, 255, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: var(--text-secondary);
      letter-spacing: 2px;
    }

    /* ── Theme switcher widget ── */
    .theme-switcher {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      gap: 6px;
      background: rgba(6, 10, 16, 0.85);
      border: 1px solid #1e3348;
      border-radius: 6px;
      padding: 6px 8px;
      backdrop-filter: blur(6px);
    }

    .theme-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .theme-btn:hover      { transform: scale(1.2); }
    .theme-btn.active     { border-color: rgba(255,255,255,0.7); transform: scale(1.15); }
    .theme-btn[data-t="nominal"]  { background: #4a80aa; }
    .theme-btn[data-t="expanse"]  { background: #8a6820; }
    .theme-btn[data-t="hazard"]   { background: #882020; }
    .theme-btn[data-t="stealth"]  { background: #303030; }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">INITIALIZING MISSION CONTROL...</div>
  </div>

  <div class="app-shell">
    <!-- Tab Content (iframes) -->
    <main class="tab-content">
      <iframe class="tab-frame active" id="frame-mission" src="/tabs/mission.html"></iframe>
      <iframe class="tab-frame" id="frame-tracking" src="/tabs/tracking.html"></iframe>
      <iframe class="tab-frame" id="frame-crew" src="/tabs/crew.html"></iframe>
      <!-- frame-info: dev paused, removed from navigation — code preserved
      <iframe class="tab-frame" id="frame-info" src="/tabs/info.html"></iframe>
      -->
      <iframe class="tab-frame" id="frame-weather" src="/tabs/weather.html"></iframe>
    </main>
  </div>

  <!-- Theme switcher — 4 color swatches, bottom-right corner -->
  <div class="theme-switcher" title="Switch theme">
    <button class="theme-btn active" data-t="nominal"  title="Nominal (NASA blue)"></button>
    <button class="theme-btn"        data-t="expanse"  title="Expanse (amber)"></button>
    <button class="theme-btn"        data-t="hazard"   title="Hazard (red alert)"></button>
    <button class="theme-btn"        data-t="stealth"  title="Stealth (dark)"></button>
  </div>

  <script>
    // ===== APP SHELL =====
    // Manages tab switching and data distribution to child iframes
    
    const AppShell = {
      currentTab: 'mission',
      currentMissionId: null,
      missions: [],
      missionData: null,
      weatherData: null,
      
      // Track which tabs are ready
      tabsReady: {
        mission: false,
        tracking: false,
        crew: false,
        info: false,
        weather: false
      },
      
      // API config
      API_BASE: window.location.origin,
      WS_URL: `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`,
      ws: null,
      
      async init() {
        console.log('ArtemisOps Shell initializing...');
        
        // Listen for messages from child iframes
        window.addEventListener('message', (event) => this.handleChildMessage(event));
        document.addEventListener('keydown', (e) => this.handleKeydown(e));
        
        // Connect WebSocket
        this.connectWebSocket();
        
        // Load missions list and determine default
        await this.loadMissions();
        
        // Determine default mission: crewed > cargo, then soonest launch within each group
        if (!this.currentMissionId && this.missions.length > 0) {
          const active = this.missions
            .filter(m => ['go', 'in flight', 'tbd', 'tbc'].includes((m.status || '').toLowerCase()))
            .sort((a, b) => {
              const crewedPat = /crew|artemis|starliner|soyuz|expedition/i;
              const aCrewed = crewedPat.test(a.name || '') || crewedPat.test(a.id || '');
              const bCrewed = crewedPat.test(b.name || '') || crewedPat.test(b.id || '');
              if (aCrewed && !bCrewed) return -1;
              if (!aCrewed && bCrewed) return 1;
              return (a.launch_date || '9999').localeCompare(b.launch_date || '9999');
            });
          this.currentMissionId = active.length > 0 ? active[0].id : this.missions[0].id;
        }
        if (!this.currentMissionId) this.currentMissionId = 'artemis-ii'; // ultimate fallback
        
        // Load initial mission data
        await this.loadMissionData(this.currentMissionId);
        
        // Load weather
        await this.loadWeather(this.currentMissionId);
        
        // Hide loading overlay after a short delay
        setTimeout(() => {
          document.getElementById('loadingOverlay').classList.add('hidden');
        }, 500);
        
        console.log('ArtemisOps Shell ready');
      },
      
      // === WebSocket ===
      connectWebSocket() {
        try {
          this.ws = new WebSocket(this.WS_URL);
          
          this.ws.onopen = () => {
            console.log('WebSocket connected');
          };
          
          this.ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            this.handleWebSocketMessage(message);
          };
          
          this.ws.onclose = () => {
            console.log('WebSocket disconnected, reconnecting...');
            setTimeout(() => this.connectWebSocket(), 5000);
          };
        } catch (e) {
          console.error('WebSocket error:', e);
        }
      },
      
      handleWebSocketMessage(message) {
        if (message.type === 'mission_update' && message.data.id === this.currentMissionId) {
          this.missionData = message.data;
          this.distributeMissionData();
        } else if (message.type === 'missions_list') {
          this.missions = message.data || [];
          this.updateMissionSelector();
        }
      },
      
      // === Data Loading ===
      async loadMissions() {
        try {
          const response = await fetch(`${this.API_BASE}/api/missions`);
          const data = await response.json();
          this.missions = data.missions || [];
          this.updateMissionSelector();
        } catch (error) {
          console.error('Failed to load missions:', error);
        }
      },
      
      async loadMissionData(missionId) {
        try {
          const response = await fetch(`${this.API_BASE}/api/missions/${missionId}`);
          if (!response.ok) throw new Error('Mission not found');
          
          this.missionData = await response.json();
          this.currentMissionId = missionId;
          
          this.updateHeader();
          this.distributeMissionData();
        } catch (error) {
          console.error('Failed to load mission:', error);
        }
      },
      
      async loadWeather(missionId) {
        try {
          const response = await fetch(`${this.API_BASE}/api/missions/${missionId}/weather`);
          if (!response.ok) throw new Error('Weather fetch failed');
          
          this.weatherData = await response.json();
          this.distributeWeatherData();
        } catch (error) {
          console.error('Failed to load weather:', error);
        }
      },
      
      // === UI Updates ===
      updateHeader() {
        if (!this.missionData) return;
        const t = document.getElementById('missionTitle');
        const s = document.getElementById('missionSubtitle');
        const l = document.getElementById('agencyLogo');
        if (t) t.textContent = this.missionData.name || 'MISSION';
        if (s) s.textContent = this.missionData.description?.substring(0, 50) + '...' || '';
        if (l && this.missionData.agency_logo) l.src = this.missionData.agency_logo;
      },

      updateMissionSelector() {
        const selector = document.getElementById('missionSelector');
        if (!selector) return;
        selector.innerHTML = this.missions.map(m =>
          `<option value="${m.id}" ${m.id === this.currentMissionId ? 'selected' : ''}>${m.name}</option>`
        ).join('');
        selector.onchange = (e) => { this.switchMission(e.target.value); };
      },
      
      // === Tab Switching ===
      switchTab(tabId) {
        this.currentTab = tabId;
        
        // Update tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tabId);
        });
        
        // Update tab frames
        document.querySelectorAll('.tab-frame').forEach(frame => {
          frame.classList.toggle('active', frame.id === `frame-${tabId}`);
        });
      },
      
      // === Mission Switching ===
      async switchMission(missionId) {
        await this.loadMissionData(missionId);
        await this.loadWeather(missionId);
      },
      
      // === Keyboard Navigation ===
      tabOrder: ['mission', 'tracking', 'crew', 'weather'], // 'info' paused — dev on hold
      
      handleKeydown(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        
        switch (e.key) {
          case 'ArrowRight':
            this.nextTab();
            break;
          case 'ArrowLeft':
            this.prevTab();
            break;
          case '0': case '1': case '2': case '3': case '4':
            const tab = this.tabOrder[parseInt(e.key)];
            if (tab) this.switchTab(tab);
            break;
          case 'f': case 'F':
            if (!e.ctrlKey && !e.metaKey) {
              this.toggleFullscreen();
            }
            break;
          case 'F11':
            this.toggleFullscreen();
            break;
        }
        if (e.preventDefault) e.preventDefault();
      },
      
      nextTab() {
        const idx = this.tabOrder.indexOf(this.currentTab);
        const next = this.tabOrder[(idx + 1) % this.tabOrder.length];
        this.switchTab(next);
      },
      
      prevTab() {
        const idx = this.tabOrder.indexOf(this.currentTab);
        const prev = this.tabOrder[(idx - 1 + this.tabOrder.length) % this.tabOrder.length];
        this.switchTab(prev);
      },
      
      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      },
      
      // === Child Iframe Communication ===
      handleChildMessage(event) {
        const { type, tab } = event.data;
        
        if (type === 'keydown') {
          // Forwarded key event from iframe
          this.handleKeydown(event.data);
          return;
        }
        
        switch (type) {
          case 'tabReady':
            this.tabsReady[tab] = true;
            this.sendDataToTab(tab);
            break;
            
          case 'countdownUpdate':
            // Could trigger notifications here
            break;
            
          case 'trackingModeChanged':
            // Could update header or log
            break;
        }
      },
      
      distributeMissionData() {
        Object.keys(this.tabsReady).forEach(tab => {
          if (this.tabsReady[tab]) {
            this.sendDataToTab(tab);
          }
        });
      },
      
      distributeWeatherData() {
        if (this.tabsReady.mission) {
          const frame = document.getElementById('frame-mission');
          frame.contentWindow.postMessage({
            type: 'setWeatherData',
            weather: this.weatherData,
            visible: this.weatherData?.should_fetch
          }, '*');
        }
      },
      
      sendDataToTab(tab) {
        const frame = document.getElementById(`frame-${tab}`);
        if (!frame) return;
        
        switch (tab) {
          case 'mission':
            if (this.missionData) {
              frame.contentWindow.postMessage({
                type: 'setMissionData',
                mission: this.missionData
              }, '*');
            }
            if (this.weatherData) {
              frame.contentWindow.postMessage({
                type: 'setWeatherData',
                weather: this.weatherData,
                visible: this.weatherData?.should_fetch
              }, '*');
            }
            break;
            
          case 'crew':
            if (this.missionData?.crew) {
              frame.contentWindow.postMessage({
                type: 'setCrewData',
                crew: this.missionData.crew
              }, '*');
            }
            break;
            
          case 'info':
            if (this.missionData) {
              frame.contentWindow.postMessage({
                type: 'setMissionData',
                mission: this.missionData
              }, '*');
            }
            break;

          case 'tracking':
            if (this.missionData) {
              frame.contentWindow.postMessage({
                type: 'setMissionData',
                mission: this.missionData
              }, '*');
            }
            break;

          case 'weather':
            if (this.missionData) {
              frame.contentWindow.postMessage({
                type: 'setMissionData',
                mission: this.missionData
              }, '*');
            }
            break;
        }
      }
    };
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      AppShell.init();

      // ── Theme switcher ──
      const btns = document.querySelectorAll('.theme-btn');
      const IFRAMES = () => document.querySelectorAll('.tab-frame');

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        btns.forEach(b => b.classList.toggle('active', b.dataset.t === theme));
        // Broadcast to all child iframes so their ao-themes.css picks it up
        IFRAMES().forEach(f => {
          try { f.contentDocument.documentElement.dataset.theme = theme; } catch(e) {}
        });
        localStorage.setItem('ao-theme', theme);
      }

      btns.forEach(btn => btn.addEventListener('click', () => applyTheme(btn.dataset.t)));

      // Restore saved theme (default: nominal)
      applyTheme(localStorage.getItem('ao-theme') || 'nominal');
    });
  </script>
</body>
</html>
