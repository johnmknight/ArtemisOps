<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Tab</title>
  <link rel="stylesheet" href="../assets/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/tabler-icons/tabler-icons-filled.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a1628;
      --bg-card: rgba(12, 20, 35, 0.95);
      --text-primary: #ffffff;
      --text-muted: #94a3b8;
      --accent-cyan: #22d3ee;
      --accent-orange: #fb923c;
      --accent-red: #ef4444;
      --border-subtle: rgba(255,255,255,0.1);
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-primary);
    }
    
    /* === NORMAL MODE === */
    .crew-layout {
      height: 100%;
      padding: 16px;
      display: flex;
      gap: 16px;
    }
    
    .crew-grid {
      flex: 1;
      display: grid;
      gap: 12px;
      align-content: stretch;
    }
    
    .crew-grid[data-count="2"] { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
    .crew-grid[data-count="3"] { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
    .crew-grid[data-count="4"] { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
    .crew-grid[data-count="5"] { grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr; }
    .crew-grid[data-count="6"] { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
    .crew-grid[data-count="7"] { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
    .crew-grid[data-count="8"] { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }
    .crew-grid[data-count="9"] { grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; }

    /* Normal Mode Crew Card */
    .crew-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100%;
    }
    
    .crew-photo-wrapper {
      width: 100%;
      overflow: hidden;
      min-height: 0;
    }
    
    .crew-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    
    .crew-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .crew-name {
      font-size: 1em;
      font-weight: 600;
      flex-shrink: 0;
    }
    
    .crew-role {
      font-size: 0.8em;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    
    .crew-bio {
      font-size: 0.75em;
      color: var(--text-muted);
      line-height: 1.4;
      opacity: 0.85;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
    }

    /* EVA Sidebar - Normal Mode */
    .eva-sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .timer-box {
      text-align: center;
      padding: 16px;
      background: var(--bg-card);
      border-radius: 8px;
    }
    
    .timer-label {
      font-size: 0.7em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .timer-value {
      font-size: 2em;
      font-weight: 300;
      font-family: 'SF Mono', Consolas, monospace;
      margin-top: 4px;
    }
    
    .schedule-list { flex: 1; }
    
    .schedule-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.85em;
    }
    
    .schedule-row {
      display: flex;
      justify-content: space-between;
    }
    
    .schedule-title { font-weight: 500; }
    .schedule-title.next { color: var(--accent-orange); }
    .schedule-date { color: var(--text-muted); }
    .schedule-crew { color: var(--text-muted); font-size: 0.9em; }

    /* === EVA ACTIVE: 3-Column Layout === */
    .crew-layout.eva-active {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    
    .section-header {
      font-size: 0.7em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 12px;
    }
    
    /* LEFT COLUMN: IVA Crew - Large & Visible */
    .iva-column {
      display: flex;
      flex-direction: column;
    }
    
    .iva-crew-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .iva-card {
      flex: 1;
      background: var(--bg-card);
      border: 3px solid var(--accent-cyan);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .iva-card img {
      flex: 1;
      width: 100%;
      object-fit: cover;
      object-position: center 25%;
      min-height: 0;
    }
    
    .iva-card-name {
      padding: 12px;
      font-size: 1.4em;
      font-weight: 700;
      text-align: center;
      background: rgba(34, 211, 238, 0.15);
      letter-spacing: 0.02em;
    }

    /* CENTER COLUMN: Video */
    .video-column {
      display: flex;
      flex-direction: column;
    }
    
    .video-container {
      flex: 1;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .video-header {
      background: var(--accent-red);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9em;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    
    .live-dot {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .video-player {
      flex: 1;
      min-height: 0;
    }
    
    .video-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* RIGHT COLUMN: EVA Crew + Timeline (2 sub-columns) */
    .eva-column {
      display: flex;
      flex-direction: column;
    }
    
    .eva-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    
    /* EVA Crew Sub-column */
    .eva-crew-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .eva-card {
      flex: 1;
      background: var(--bg-card);
      border: 3px solid var(--accent-orange);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .eva-card img {
      flex: 1;
      width: 100%;
      object-fit: cover;
      object-position: center 25%;
      min-height: 0;
    }
    
    .eva-card-info {
      padding: 10px;
      text-align: center;
      background: rgba(251, 146, 60, 0.15);
    }
    
    .eva-card-name {
      font-size: 1.2em;
      font-weight: 700;
    }
    
    .eva-card-role {
      font-size: 0.9em;
      color: var(--accent-orange);
      font-weight: 600;
    }

    /* Timeline Sub-column */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .timeline-timer {
      text-align: center;
      padding: 16px 12px;
      background: var(--bg-card);
      border: 3px solid var(--accent-red);
      border-radius: 10px;
    }
    
    .timeline-timer-label {
      font-size: 0.7em;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    
    .timeline-timer-value {
      font-size: 2em;
      font-weight: 400;
      font-family: 'SF Mono', Consolas, monospace;
      color: var(--accent-red);
      margin-top: 4px;
    }
    
    .timeline-items {
      flex: 1;
    }
    
    .timeline-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .timeline-item-title {
      font-size: 0.9em;
      font-weight: 600;
    }
    
    .timeline-item.live .timeline-item-title {
      color: var(--accent-red);
    }
    
    .timeline-item-date {
      font-size: 0.8em;
      color: var(--text-muted);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }

    /* Agency badge */
    .crew-agency {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7em;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-cyan);
      margin-bottom: 2px;
    }
    .crew-agency .agency-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agency-NASA .agency-dot { background: #4a9eff; }
    .agency-CSA .agency-dot { background: #e63946; }
    .agency-ESA .agency-dot { background: #3399ff; }
    .agency-JAXA .agency-dot { background: #ff6b6b; }
    .agency-Roscosmos .agency-dot { background: #c41e3a; }
    .agency-SpaceX .agency-dot { background: #a0a0a0; }

    /* Bio link */
    .crew-bio-link {
      display: inline-block;
      font-size: 0.7em;
      color: var(--accent-cyan);
      text-decoration: none;
      margin-top: 4px;
      opacity: 0.7;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .crew-bio-link:hover { opacity: 1; text-decoration: underline; }

    /* Loading skeleton */
    .skeleton-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 0;
      height: 100%;
    }
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .skeleton-photo {
      background: linear-gradient(110deg, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(110deg, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-line.short { width: 60%; }
    .skeleton-line.medium { width: 80%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Error state */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
    }
    .error-state .error-icon {
      font-size: 2.5em;
      opacity: 0.4;
    }
    .error-state .error-msg {
      font-size: 0.9em;
      opacity: 0.7;
    }
    .error-state .error-hint {
      font-size: 0.75em;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="crew-layout" id="crewLayout">
    <div class="skeleton-grid">
      <div class="skeleton-card"><div class="skeleton-photo"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-photo"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-photo"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-photo"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
    </div>
  </div>

  <script>
    const CrewTab = {
      crew: [],
      evaData: null,
      timerInterval: null,
      
      init() {
        window.addEventListener('message', e => {
          if (e.data.type === 'setCrewData') {
            this.crew = e.data.crew || [];
            this.evaData = e.data.evaData || null;
            this.render();
          }
          if (e.data.type === 'startEva') this.startEva(e.data.evaId);
        });
        window.parent.postMessage({ type: 'tabReady', tab: 'crew' }, '*');
      },
      
      hasEvas() { return this.evaData?.evas?.length > 0; },
      getNextEva() { return this.evaData?.evas?.find(e => e.status === 'scheduled' || e.status === 'active'); },
      getActiveEva() { return this.evaData?.evas?.find(e => e.status === 'active'); },
      
      getEvaCrew(eva) {
        if (!eva?.crew) return [];
        return this.crew.filter(m => eva.crew.some(n => m.name.includes(n) || n.includes(m.name.split(' ').pop())));
      },
      
      getIvaCrew(eva) {
        const onEva = this.getEvaCrew(eva);
        return this.crew.filter(m => !onEva.includes(m));
      },
      
      startEva(id) {
        const eva = this.evaData.evas.find(e => e.id === id);
        if (eva) {
          eva.status = 'active';
          eva.start_time = new Date().toISOString();
          eva.feed_url = "https://www.youtube.com/embed/86YLFOog4GM?autoplay=1";
          this.render();
        }
      },
      
      formatTime(ms) {
        const h = Math.floor(Math.abs(ms) / 3600000);
        const m = Math.floor((Math.abs(ms) % 3600000) / 60000);
        const s = Math.floor((Math.abs(ms) % 60000) / 1000);
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      },
      
      formatDate(iso) {
        return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      },
      
      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          const el = document.getElementById('evaTimer');
          if (!el) return;
          const active = this.getActiveEva();
          const next = this.getNextEva();
          if (active?.start_time) {
            el.textContent = this.formatTime(Date.now() - new Date(active.start_time));
          } else if (next) {
            el.textContent = this.formatTime(new Date(next.scheduled_start) - Date.now());
          }
        }, 1000);
      },

      renderNormal() {
        const next = this.getNextEva();
        const timerValue = next ? this.formatTime(new Date(next.scheduled_start) - Date.now()) : '--:--:--';
        
        return `
          <div class="crew-grid" data-count="${this.crew.length}">
            ${this.crew.map(m => `
              <div class="crew-card">
                <div class="crew-photo-wrapper">
                  <img src="${m.photo_url || m.photo || ''}" alt="${m.name}" class="crew-photo">
                </div>
                <div class="crew-info">
                  ${m.agency ? `<div class="crew-agency agency-${m.agency}"><span class="agency-dot"></span>${m.agency}</div>` : ''}
                  <div class="crew-name">${m.name}</div>
                  <div class="crew-role">${m.role}</div>
                  ${m.bio ? `<div class="crew-bio">${m.bio}</div>` : ''}
                  ${m.bio_url ? `<a class="crew-bio-link" href="${m.bio_url}" target="_blank" rel="noopener">Full bio ↗</a>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
          ${this.hasEvas() ? `
            <div class="eva-sidebar">
              <div class="timer-box">
                <div class="timer-label">Next EVA</div>
                <div class="timer-value" id="evaTimer">${timerValue}</div>
              </div>
              <div class="schedule-list">
                ${this.evaData.evas.map((eva, i) => `
                  <div class="schedule-item">
                    <div class="schedule-row">
                      <span class="schedule-title ${next?.id === eva.id ? 'next' : ''}">EVA-${i+1}</span>
                      <span class="schedule-date">${this.formatDate(eva.scheduled_start)}</span>
                    </div>
                    <div class="schedule-crew">${eva.crew.join(', ')}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        `;
      },

      renderEvaActive(active) {
        const ivaCrew = this.getIvaCrew(active);
        const evaCrew = this.getEvaCrew(active);
        const elapsed = this.formatTime(Date.now() - new Date(active.start_time));
        
        return `
          <!-- LEFT: IVA Crew -->
          <div class="iva-column">
            <div class="section-header">Inside Vehicle</div>
            <div class="iva-crew-grid">
              ${ivaCrew.map(m => `
                <div class="iva-card">
                  <img src="${m.photo_url || m.photo || ''}" alt="${m.name}">
                  <div class="iva-card-name">${m.name.split(' ').pop()}</div>
                </div>
              `).join('')}
            </div>
          </div>
          
          <!-- CENTER: Video -->
          <div class="video-column">
            <div class="section-header">Live Feed</div>
            <div class="video-container">
              <div class="video-header">
                <span class="live-dot"></span>
                <span>LIVE</span>
              </div>
              <div class="video-player">
                <iframe src="${active.feed_url}" allowfullscreen></iframe>
              </div>
            </div>
          </div>
          
          <!-- RIGHT: EVA Crew + Timeline -->
          <div class="eva-column">
            <div class="section-header">Spacewalk</div>
            <div class="eva-content">
              <div class="eva-crew-list">
                ${evaCrew.map((m, i) => `
                  <div class="eva-card">
                    <img src="${m.photo_url || m.photo || ''}" alt="${m.name}">
                    <div class="eva-card-info">
                      <div class="eva-card-name">${m.name.split(' ').pop()}</div>
                      <div class="eva-card-role">EV-${i + 1}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="timeline-list">
                <div class="timeline-timer">
                  <div class="timeline-timer-label">Elapsed</div>
                  <div class="timeline-timer-value" id="evaTimer">${elapsed}</div>
                </div>
                <div class="timeline-items">
                  ${this.evaData.evas.map((eva, i) => `
                    <div class="timeline-item ${eva.status === 'active' ? 'live' : ''}">
                      <div class="timeline-item-title">EVA-${i+1}${eva.status === 'active' ? ' • LIVE' : ''}</div>
                      <div class="timeline-item-date">${this.formatDate(eva.scheduled_start)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      },

      render() {
        const layout = document.getElementById('crewLayout');
        
        if (!this.crew?.length) {
          layout.innerHTML = '<div class="error-state"><div class="error-icon"><i class="ti ti-user-circle"></i></div><div class="error-msg">No crew data available</div><div class="error-hint">Waiting for mission data from server</div></div>';
          return;
        }
        
        const active = this.getActiveEva();
        
        layout.classList.remove('eva-active');
        
        if (active) {
          layout.classList.add('eva-active');
          layout.innerHTML = this.renderEvaActive(active);
        } else {
          layout.innerHTML = this.renderNormal();
        }
        
        if (this.hasEvas()) this.startTimer();
      }
    };
    
    // Forward navigation keys to parent shell
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (['ArrowLeft', 'ArrowRight'].includes(e.key) || /^[0-4]$/.test(e.key) || e.key === 'f' || e.key === 'F' || e.key === 'F11') {
        window.parent.postMessage({ type: 'keydown', key: e.key, ctrlKey: e.ctrlKey, metaKey: e.metaKey }, '*');
        e.preventDefault();
      }
    });

    CrewTab.init();
  </script>
</body>
</html>
