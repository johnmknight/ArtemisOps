<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Tab</title>
  <link rel="stylesheet" href="../assets/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/tabler-icons/tabler-icons-filled.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a1628;
      --text-primary: #ffffff;
      --text-secondary: #8b949e;
      --accent-blue: #4a9eff;
      --accent-cyan: #00bcd4;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Courier New', monospace;
      color: var(--text-primary);
    }
    
    .tracking-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    /* Content area */
    .tracking-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    .tracking-view {
      position: absolute;
      inset: 0;
      display: none;
    }
    
    .tracking-view.active {
      display: block;
    }
    
    .tracking-view iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="tracking-layout">
    <!-- Tracking Views -->
    <div class="tracking-content">
      <!-- ISS Live View -->
      <div class="tracking-view active" id="view-iss">
        <iframe id="issFrame" src="/mockups/mode3-iss-live.html"></iframe>
      </div>
      
      <!-- Artemis II View -->
      <div class="tracking-view" id="view-artemis-ii">
        <iframe id="artemisIIFrame" src="/mockups/mode3-artemis2-nasa-style.html"></iframe>
      </div>
      
      <!-- Artemis II 3D View -->
      <div class="tracking-view" id="view-artemis-ii-3d">
        <iframe id="artemisII3DFrame" src="/mockups/mode3-artemis2-3d-v2.html"></iframe>
      </div>

      <!-- Artemis III View -->
      <div class="tracking-view" id="view-artemis-iii">
        <iframe id="artemisIIIFrame" src="/mockups/mode3-artemis3-nrho.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    const TrackingTab = {
      currentMode: 'iss',
      
      init() {
        // Listen for messages from parent
        window.addEventListener('message', (event) => {
          if (event.data.type === 'setTrackingMode') {
            this.switchMode(event.data.mode);
          }
        });
        
        // Notify parent that tab is ready
        window.parent.postMessage({ type: 'tabReady', tab: 'tracking' }, '*');
      },
      
      switchMode(mode) {
        this.currentMode = mode;
        
        // Update buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        
        // Update views
        document.querySelectorAll('.tracking-view').forEach(view => {
          view.classList.toggle('active', view.id === `view-${mode}`);
        });
        
        // Notify parent of mode change
        window.parent.postMessage({
          type: 'trackingModeChanged',
          mode: mode
        }, '*');
      }
    };
    
    // Forward navigation keys to parent shell
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (['ArrowLeft', 'ArrowRight'].includes(e.key) || /^[0-4]$/.test(e.key) || e.key === 'f' || e.key === 'F' || e.key === 'F11') {
        window.parent.postMessage({ type: 'keydown', key: e.key, ctrlKey: e.ctrlKey, metaKey: e.metaKey }, '*');
        e.preventDefault();
      }
    });

    TrackingTab.init();
  </script>
</body>
</html>
